skill_id: manipulation.pick
description: Grasp an object whose pose was observed recently.
inputs:
  - {name: object, type: entity}
preconditions:
  # Time-sensitive: a pose older than 5 s holds the action instead of grasping at stale data.
  - {predicate: pose_known, args: ["$object"], expected: true, max_age_s: 5.0}
expected_effects:
  - {predicate: holding, args: [robot, "$object"], expected: true}
verification: {required: true, verifier_id: world_fact}
cancellation: {mode: safe_state_first, max_stop_time_s: 2.0}
failure_semantics: {timeout_s: 30.0, retryable: true}
required_capabilities: [manipulation.single_arm]
required_resources: [arm_0, gripper_0]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "robot-framework"
version = "0.1.0a1"
description = "Standardized, extensible robot task framework: fixed contracts, swappable planners, executives, providers and robots"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Anhar Risnumawan" }]
keywords = ["robotics", "task-planning", "behavior-trees", "skills", "framework"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.11,<3",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "jsonschema>=4.25",
    "types-PyYAML",
]

[project.scripts]
robot-framework = "robot_framework.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/robot_framework"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# A sourced ROS 2 environment registers launch_testing pytest plugins that need ROS-only
# dependencies; Phase 1 must not depend on ROS, so they are blocked explicitly.
addopts = "-p no:launch_testing -p no:launch_ros"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.coverage.run]
source = ["robot_framework"]
branch = true
